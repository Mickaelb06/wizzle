[package]
name = "wizzle-spike-mls"
version = "0.0.0"
edition = "2021"
publish = false
# SPIKE JETABLE (Lot 0) : ne pas réutiliser tel quel en production.

[dependencies]
openmls = { version = "0.9.2", features = ["js"] }
openmls_rust_crypto = "0.6.0"
openmls_basic_credential = "0.6.0"
openmls_traits = "0.6.0"
tls_codec = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
getrandom04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
